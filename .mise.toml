[tools]
java = "temurin-21"
ruby = "3.3.6"

[tasks.test]
description = "Run unit tests and static analysis"
run = "./gradlew test allTests detekt"

[tasks.full-test]
description = "Run all tests including integration tests"
run = "./gradlew test allTests runIntegrationTests detekt"

[tasks.detekt]
description = "Run Detekt static analysis"
run = "./gradlew detekt"

[tasks.build]
description = "Build release artifacts"
run = "./gradlew build bundle"

[tasks.build-debug]
description = "Assemble a full debug APK"
run = "./gradlew assembleFullDebug"

[tasks.install-debug]
description = "Install a full debug APK on a connected device"
run = "./gradlew installFullDebug"

[tasks.test-deeplinks]
description = "Open a few tapes.kglw.net show links in the running app (android|ios, default android)"
run = """
#!/usr/bin/env bash
set -e
PLATFORM="${1:-android}"
PACKAGE="gizz.tapes.full.debug"
URLS=(
  "https://tapes.kglw.net/2026-10-17"      # regular show
  "https://tapes.kglw.net/2026-08-14stu"   # one of two shows on the same date
  "https://tapes.kglw.net/2023-06-08early" # early/late shows
  "https://tapes.kglw.net/2099-01-01"      # unknown show -> "Show not found"
)

if [[ "$PLATFORM" == "android" ]]; then
  # debug builds aren't in assetlinks.json, so approve the domain by hand
  adb shell pm set-app-links-user-selection --user cur --package "$PACKAGE" true tapes.kglw.net
fi

for url in "${URLS[@]}"; do
  read -rp "Press Enter to open $url "
  if [[ "$PLATFORM" == "ios" ]]; then
    xcrun simctl openurl booted "$url"
  else
    adb shell am start -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$url" > /dev/null
  fi
done
"""

[tasks.build-ios]
description = "Archive the iOS app for release"
run = """
#!/usr/bin/env bash
set -e
./gradlew :composeApp:generateDummyFramework
pod install --project-directory=iosApp
xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -destination 'generic/platform=iOS' -configuration Release archive -archivePath build/iosApp.xcarchive
"""

[tasks.run-integration-test]
description = "Run networking integration tests on JVM"
run = "./gradlew :networking-integration:jvmRun"

[tasks.sign-readme]
description = "PGP sign README.md (writes README.md.asc)"
run = "gpg --armor --detach-sign --yes -u 3239DF005BDF2CD2789857AF59F842F73BAF2A8D README.md && gpg --verify README.md.asc README.md"

[tasks.release]
description = "Tag the current version, trigger CI to publish to both stores' internal tracks, then bump version"
run = "bundle exec fastlane release"

[tasks.promote-beta]
description = "Promote builds to Play beta + TestFlight external testers (extra args go to gh, e.g. -- -f ref=<tag> -f platform=ios)"
run = "gh workflow run promote.yml -f track=beta"

[tasks.promote-production]
description = "Promote builds to Play production + App Store review (extra args go to gh, e.g. -- -f ref=<tag> -f platform=ios)"
run = "gh workflow run promote.yml -f track=production"

[tasks.create-github-release]
description = "Create GitHub release from CI-built artifacts (use if the release workflow's GitHub step failed)"
run = "GITHUB_TOKEN=$(gh auth token) bundle exec fastlane android create_github_release"

[tasks.revert-release]
description = "Delete the last release tag and revert the version bump commit (use if release failed)"
run = """
#!/usr/bin/env bash
set -e
LAST_TAG=$(git describe --tags --abbrev=0)
echo "This will delete tag '$LAST_TAG' remotely and locally, and revert the version bump commit."
read -p "Continue? (y/N) " confirm
if [[ "$confirm" != "y" && "$confirm" != "Y" ]]; then
  echo "Aborted."
  exit 1
fi
git push origin --delete "$LAST_TAG"
git tag -d "$LAST_TAG"
git revert HEAD --no-edit
git push
echo "Done. Tag '$LAST_TAG' deleted and version bump reverted."
"""
