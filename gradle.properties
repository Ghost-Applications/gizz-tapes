gizz.tapes.defaultBuildNumber=112
gizz.tapes.versionName=MarsForTheRich
gizz.tapes.iosVersion=1.3

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.jvmargs=-Xmx12G -XX:MaxMetaspaceSize=2G -XX:+UseG1GC
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

kotlin.daemon.jvm.options=-Xmx4g
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.code.style=official
# composeApp deliberately stays on the CocoaPods integration (needed for the Cast SDK cinterop
# dependency) rather than migrating to Swift Package Manager.
kotlin.native.cocoapods.swiftpmMigration.nowarn=true

android.uniquePackageNames=true
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=true
android.newDsl=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
