name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Build and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          GIZZ_TAPES_ENCODED_KEY: ${{ secrets.GIZZ_TAPES_ENCODED_KEY }}
        run: echo -n $GIZZ_TAPES_ENCODED_KEY | base64 --decode > keys/release.jks
      - name: Compute version code
        id: version_code
        run: echo "code=$(( $(date +%s) / 60 ))" >> $GITHUB_OUTPUT
      - name: Build release artifacts
        env:
          GIZZ_TAPES_KEYSTORE_PASSWORD: ${{ secrets.GIZZ_TAPES_KEYSTORE_PASSWORD }}
          GIZZ_TAPES_KEY_ALIAS: ${{ secrets.GIZZ_TAPES_KEY_ALIAS }}
          GIZZ_TAPES_KEY_PASSWORD: ${{ secrets.GIZZ_TAPES_KEY_PASSWORD }}
          GIZZ_TAPES_KEYSTORE_LOCATION: keys/release.jks
          GIZZ_TAPES_BUILD_NUMBER: ${{ steps.version_code.outputs.code }}
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          -Dorg.gradle.jvmargs="-Xmx4G -Xms1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
      - name: Import GPG key
        run: |
          echo "${{ secrets.PGP_KEY }}" > private.key
          gpg --batch --passphrase "${{ secrets.PGP_PASSWORD }}" --import private.key
      - name: Sign APKs with GPG
        run: |
          find androidApp/build/outputs/apk -name "*.apk" | while read -r file; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.PGP_PASSWORD }}" --armor --detach-sign "$file"
          done
      - name: Sign AABs with GPG
        run: |
          find androidApp/build/outputs/bundle -name "*release*.aab" | while read -r file; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.PGP_PASSWORD }}" --armor --detach-sign "$file"
          done
      - name: Extract changelog
        id: changelog
        run: |
          NOTES=$(awk '/^== /{found++} found==1{if(/^== /){next} print}' CHANGELOG.adoc | sed '/^$/d' | head -50)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.tag }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            androidApp/build/outputs/apk/foss/release/*.apk \
            androidApp/build/outputs/apk/full/release/*.apk \
            androidApp/build/outputs/bundle/fossRelease/*.aab \
            androidApp/build/outputs/bundle/fullRelease/*.aab \
            androidApp/build/outputs/apk/foss/release/*.asc \
            androidApp/build/outputs/apk/full/release/*.asc \
            androidApp/build/outputs/bundle/fossRelease/*.asc \
            androidApp/build/outputs/bundle/fullRelease/*.asc