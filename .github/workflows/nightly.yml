name: Nightly

on:
  push:
    branches:
      - main
    paths:
      - 'composeApp/**'
      - 'androidApp/**'
      - 'networking/**'
      - 'networking-integration/**'
      - 'gradle/**'
      - 'fastlane/**'

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          GIZZ_TAPES_ENCODED_KEY: ${{ secrets.GIZZ_TAPES_ENCODED_KEY }}
        run: echo -n $GIZZ_TAPES_ENCODED_KEY | base64 --decode > keys/release.jks
      - name: Build release APKs
        env:
          GIZZ_TAPES_KEYSTORE_PASSWORD: ${{ secrets.GIZZ_TAPES_KEYSTORE_PASSWORD }}
          GIZZ_TAPES_KEY_PASSWORD: ${{ secrets.GIZZ_TAPES_KEY_PASSWORD }}
          GIZZ_TAPES_KEY_ALIAS: ${{ secrets.GIZZ_TAPES_KEY_ALIAS }}
          GIZZ_TAPES_KEYSTORE_LOCATION: keys/release.jks
        run: >
          ./gradlew :androidApp:assembleRelease
          -Dorg.gradle.jvmargs="-Xmx6G -Xms1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
      - name: Upload foss release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-android-foss
          path: androidApp/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
      - name: Upload full release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-android-full
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package-task: packageDeb
            artifact-name: nightly-desktop-deb
            artifact-path: composeApp/build/compose/binaries/main/deb/
          - os: macos-latest
            package-task: packageDmg
            artifact-name: nightly-desktop-dmg
            artifact-path: composeApp/build/compose/binaries/main/dmg/
          - os: windows-latest
            package-task: packageMsi
            artifact-name: nightly-desktop-msi
            artifact-path: composeApp/build/compose/binaries/main/msi/
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install WiX Toolset
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package desktop app
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
        run: ./gradlew :composeApp:${{ matrix.package-task }}
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Publish nightly release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Delete previous nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag || true
      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly \
            --title "Nightly build" \
            --notes "Automated build from commit ${{ github.sha }}. May be unstable." \
            --prerelease \
            --target "${{ github.sha }}" \
            artifacts/nightly-android-foss/*.apk \
            artifacts/nightly-android-full/*.apk \
            artifacts/nightly-desktop-deb/* \
            artifacts/nightly-desktop-dmg/* \
            artifacts/nightly-desktop-msi/*
