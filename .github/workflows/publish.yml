name: Publish to Playstore
on:
  push:
    branches:
      - 'main'
    paths:
      - 'gradle.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Retrieve Key File
        env:
          GIZZ_TAPES_ENCODED_KEY: ${{ secrets.GIZZ_TAPES_ENCODED_KEY }}
        run: echo -n $GIZZ_TAPES_ENCODED_KEY | base64 --decode > ./keys/release.jks
      - name: Provide Publish Key
        env:
          GIZZ_TAPES_PUBLISH_KEY: ${{ secrets.GIZZ_TAPES_SUPPLY_KEY }}
        run: echo $GIZZ_TAPES_PUBLISH_KEY > ./keys/gizz-tapes-supply-key.json
      - name: Build with Gradle
        env:
          GIZZ_TAPES_KEYSTORE_PASSWORD: ${{ secrets.GIZZ_TAPES_KEYSTORE_PASSWORD }}
          GIZZ_TAPES_KEY_ALIAS: ${{ secrets.GIZZ_TAPES_KEY_ALIAS }}
          GIZZ_TAPES_KEY_PASSWORD: ${{ secrets.GIZZ_TAPES_KEY_PASSWORD }}
          GIZZ_TAPES_KEYSTORE_LOCATION: ./keys/release.jks
        run: bundle exe fastlane beta
      - name: Import GPG key
        run: |
          echo "${{ secrets.PGP_KEY }}" > private.key
          gpg --batch --passphrase "${{ secrets.PGP_PASSWORD }}" --import private.key
      - name: Sign AAB with GPG
        run: |
          find androidApp/build/outputs/bundle/fullRelease -name "*.aab" | while read -r file; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.PGP_PASSWORD }}" --armor --detach-sign "$file"
          done
      - name: Upload full release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-full-release-aab
          path: androidApp/build/outputs/bundle/fullRelease/
          if-no-files-found: error
