name: Release Desktop

# Builds the desktop installers and attaches them (with GPG signatures) to an existing GitHub
# release. Called by release.yml and create-github-release.yml once the release has been created.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        required: true
        type: string
      tag:
        description: 'Release tag to upload to (defaults to gizz.tapes.versionName, matching Fastlane)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Desktop (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package-task: packageDeb
            artifact-name: desktop-deb
            artifact-path: composeApp/build/compose/binaries/main/deb/
          - os: macos-latest
            package-task: packageDmg
            artifact-name: desktop-dmg
            artifact-path: composeApp/build/compose/binaries/main/dmg/
          - os: windows-latest
            package-task: packageMsi
            artifact-name: desktop-msi
            artifact-path: composeApp/build/compose/binaries/main/msi/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install WiX Toolset
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package desktop app
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
        run: ./gradlew :composeApp:${{ matrix.package-task }}
      - name: Import GPG key
        shell: bash
        run: |
          echo "${{ secrets.PGP_KEY }}" > private.key
          gpg --batch --passphrase "${{ secrets.PGP_PASSWORD }}" --import private.key
      - name: Sign desktop artifact with GPG
        shell: bash
        run: |
          for file in ${{ matrix.artifact-path }}*; do
            if [ -f "$file" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.PGP_PASSWORD }}" --armor --detach-sign "$file"
            fi
          done
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  upload:
    name: Upload to GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(grep "^gizz.tapes.versionName=" gradle.properties | cut -d= -f2)
          fi
          gh release upload "$TAG" --clobber \
            artifacts/desktop-deb/* \
            artifacts/desktop-dmg/* \
            artifacts/desktop-msi/*
